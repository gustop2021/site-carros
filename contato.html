</head>

<body>

        <nav class="navbar navbar-expand-md bg-dark navbar-dark">
            <div class="container-fluid">
                <a class="navbar-brand" href="index.html">Mundo dos Carros</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal"
                    aria-controls="menuPrincipal" aria-expanded="false" aria-label="Abrir menu">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="menuPrincipal">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item"><a class="nav-link" href="index.html">Início</a></li>
                        <li class="nav-item"><a class="nav-link" href="frota.html">Frota</a></li>
                        <li class="nav-item"><a class="nav-link" href="reservas.html">Reservas</a></li>
                        <li class="nav-item"><a class="nav-link" href="videos.html">Vídeos</a></li>

                                externo</a></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>
    <main class="container my-4">
        <h1>Contato</h1>
        <div class="alert alert-success d-none" id="alertaSucesso" role="alert">
            Mensagem enviada com sucesso.
        </div>
        <form id="formContato">
            <div class="mb-3">
                <label class="form-label" for="nome">Nome</label>
                <input type="text" class="form-control" id="nome" required minlength="3" placeholder="Nome completo">
            </div>
            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" required placeholder="Seu E-mail">
            </div>
            <div class="mb-3">
                <label for="telefone" class="form-label">Telefone</label>
                <input type="text" class="form-control" id="telefone" pattern="\d{2} 9\d{8}"
                    title="Use o formato: 41 912345678" placeholder="Seu telefone">
            </div>
            <div class="mb-3">
                <label for="assunto" class="form-label">Assunto</label>
                <select name="assunto" id="assunto" class="form-select" required>
                    <option value="">Selecione</option>
                    <option value="valores">Valores</option>
                    <option value="frota">Frota</option>
                    <option value="documentos">Documentos</option>
                    <option value="retiradaedevolucao">Retirada e devolução</option>
                </select>
            </div>
            <div class="mb-3">
                <label for="mensagem" class="form-label">Mensagem</label>
                <textarea type="text" class="form-control" id="mensagem" required minlength="10"
                    placeholder="Digite sua mensagem" rows="5"></textarea>
            </div>
            <button type="submit" class="btn btn-primary">Enviar</button>
        </form>
    </main>

    <footer class="text-center py-3">© 2026 Mundo dos Carros</footer>
    <script src="js/script.js"></script>
</body>

</html>
