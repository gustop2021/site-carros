    <main>
        <h1>Reservas</h1>
        <section id="formulario">
            <h2>Fazer uma reserva</h2>
            <form id="formReserva">
                <label for="nome">Nome completo</label>
                <input id="nome" type="text" required placeholder="Seu nome Completo" minlength="3">
                <label for="veiculo">Selecione seu veículo</label>
                <select name="veiculo" id="veiculo" required>
                    <option value="">Selecione</option>
                    <option value="kwid">Renault Kwid</option>
                    <option value="oroch">Renault Oroch</option>
                    <option value="kardian">Renault Kardian</option>
                    <option value="sandero">Renault Sandero</option>
                    <option value="duster">Renault Duster</option>
                    <option value="logan">Renault Logan</option>
                </select>
                <label for="retirada">Data da retirada</label>
                <input type="date" id="retirada" required>
                <label for="devolucao">Data da devolução</label>
                <input type="date" id="devolucao" required>
                <button type="submit">Reservar</button>
            </form>
        </section>
        <section>
            <h2>Minhas reservas</h2>
            <ul id="listaReservas">

            </ul>
        </section>
