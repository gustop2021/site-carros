    <main>
        <h1>Nossa frota</h1>
        <section>
            <h2>Escolha seu veículo</h2>
            <div class="filtros botoes">
                <button type="button" data-filtro="todos">Todos</button>
                <button type="button" data-filtro="suv">SUV</button>
                <button type="button" data-filtro="sedan">Sedan</button>
                <button type="button" data-filtro="economicos">Econômicos</button>

            </div>
            <div class="galeria">
                <figure data-categoria="economicos">
                    <img src="img/kwidCard.webp" alt="kwid">
                    <figcaption>
                        Renault Kwid
                    </figcaption>
                </figure>
                <figure data-categoria="sedan">
                    <img src="img/logan.webp" alt="logan">
                    <figcaption>
                      Renault Logan  
                    </figcaption>
                </figure>
                <figure data-categoria="suv">
                    <img src="img/duster.webp" alt="duster">
                    <figcaption>
                        Renault Duster
                    </figcaption>
                </figure>
                <figure data-categoria="economicos">
                    <img src="img/sandero.jpg" alt="sandero">
                    <figcaption>
                        Renault Sandero
                    </figcaption>
                </figure>
                <figure data-categoria="economicos">
                    <img src="img/kardian.webp" alt="kardian">
                    <figcaption>
                        Renault Kardian
                    </figcaption>
                </figure>
                <figure data-categoria="utilitarios">
                    <img src="img/oroch.jpg" alt="oroch">
                    <figcaption>
                        Renault Oroch
                    </figcaption>
                </figure>
            </div>
